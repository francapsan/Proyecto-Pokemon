spring.application.name=pokemonv2

# Orígenes permitidos por CORS (coma-separados)
app.cors.allowed-origins=http://localhost:3000,http://localhost:5173

# PokéAPI: IDs de la Pokédex nacional del catálogo (Blastoise, Charizard, Venusaur)
pokeapi.base-url=https://pokeapi.co/api/v2
pokeapi.pokemon-ids=9,6,3
# Los Pokémon aleatorios se sortean entre los IDs 1..max-pokedex-id (1025 = hasta la 9ª generación)
pokeapi.max-pokedex-id=1025

# Reducimos el ruido del startup de Spring
logging.level.root=INFO
logging.level.com.pokemon=INFO
